spring:
  application:
    name: payment-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      ack-mode: ${PAYMENT_ACK_MODE:BATCH}
    consumer:
      group-id: ${PAYMENT_CONSUMER_GROUP_ID:payment-service}
      auto-offset-reset: ${PAYMENT_AUTO_OFFSET_RESET:earliest}
      max-poll-records: ${PAYMENT_MAX_POLL_RECORDS:500}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        "[spring.json.trusted.packages]": com.olena.events
        "[spring.json.value.default.type]": com.olena.events.OrderCreated

app:
  kafka:
    listener:
      concurrency: ${PAYMENT_LISTENER_CONCURRENCY:1}
      style: ${PAYMENT_LISTENER_STYLE:automatic}
      processing-delay-ms: ${PAYMENT_PROCESSING_DELAY_MS:0}
      failure-order-id: ${PAYMENT_FAILURE_ORDER_ID:disabled}
      failure-offset: ${PAYMENT_FAILURE_OFFSET:-1}
      retry:
        backoff-ms: ${PAYMENT_RETRY_BACKOFF_MS:1000}
        max-retries: ${PAYMENT_RETRY_MAX_RETRIES:2}

logging:
  file:
    name: ${LOG_FILE:logs/payment-service.log}
